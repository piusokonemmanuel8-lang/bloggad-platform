name: Build Bloggad frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/bloggad-frontend-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bloggad-frontend-main
  cancel-in-progress: false

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Publish frontend build into Express dist
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/dist/index.html
          test -d frontend/dist/assets
          rm -rf backend/dist
          mkdir -p backend/dist
          cp -a frontend/dist/. backend/dist/
          test -f backend/dist/index.html

      - name: Commit built frontend if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all --force -- backend/dist
          if git diff --cached --quiet; then
            echo "BLOGGAD_FRONTEND_DIST=UNCHANGED"
            exit 0
          fi
          git commit -m "Build Bloggad frontend assets [skip ci]"
          git push origin HEAD:main
          echo "BLOGGAD_FRONTEND_DIST=PUSHED"
